spring.application.name=portfolio-backend-ia

# Google GenAI - API Key
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Chat (Se actualiza el nombre del modelo aquí)
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.7

# Embeddings
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.options.model=text-embedding-004

# Servidor
server.port=8080

# Logging
logging.level.tech.matiaszelarayan=DEBUG
logging.level.org.springframework.ai=INFO

# Configuración de CORS
cors.allowed-origins=http://localhost:4321,https://matiaszelarayan.tech

# Seguridad: Desactivar Stack Traces en respuestas de error por defecto
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false