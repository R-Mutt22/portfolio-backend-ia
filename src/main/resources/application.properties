spring.application.name=portfolio-backend-ia

# OpenRouter (Base URL y API Key)
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}

# Chat - Modelo gratuito en OpenRouter
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL:openrouter/auto}

# Embeddings - Procesados en la nube vía OpenRouter (Desactiva el procesamiento ONNX local)
spring.ai.model.transformers.embedding.enabled=false
spring.ai.openai.embedding.enabled=true
spring.ai.openai.embedding.options.model=${OPENROUTER_EMBEDDING_MODEL:text-embedding-3-small}

# Servidor
server.port=8080

# Logging
logging.level.tech.matiaszelarayan=DEBUG
logging.level.org.springframework.ai=INFO

# Configuración de CORS
cors.allowed-origins=http://localhost:4321,https://matiaszelarayan.tech

# Seguridad
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never